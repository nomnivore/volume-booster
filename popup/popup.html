<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volume Boost</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 260px;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      user-select: none;
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
    }

    header svg {
      flex-shrink: 0;
    }

    h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    /* Whitelist section */

    .whitelist-section {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .whitelist-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .whitelist-row-label {
      font-size: 12px;
      color: #aaa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    /* Toggle switch */

    .toggle-switch {
      position: relative;
      flex-shrink: 0;
      width: 36px;
      height: 20px;
    }

    .toggle-switch input[type="checkbox"] {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: #333355;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle-track::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.2s;
    }

    .toggle-switch input:checked + .toggle-track {
      background: #4a9eff;
    }

    .toggle-switch input:checked + .toggle-track::after {
      transform: translateX(16px);
    }

    /* Volume section */

    .volume-display {
      text-align: center;
      margin-bottom: 10px;
    }

    .volume-value {
      font-size: 36px;
      font-weight: 700;
      color: #4a9eff;
      line-height: 1;
    }

    .volume-label {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
    }

    .slider-track {
      position: relative;
      margin-bottom: 14px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #333355;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #4a9eff;
      border: 2px solid #1a1a2e;
      cursor: pointer;
    }

    input[type="range"]::-moz-range-progress {
      background: #4a9eff;
      height: 6px;
      border-radius: 3px;
    }

    .tick-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #666;
      margin-top: 4px;
      padding: 0 2px;
    }

    .tick-labels span.active {
      color: #4a9eff;
    }

    /* Disabled state */

    .volume-section.disabled .volume-display,
    .volume-section.disabled .slider-track,
    .volume-section.disabled #resetBtn {
      opacity: 0.4;
    }

    .volume-section.disabled input[type="range"] {
      pointer-events: none;
    }

    .volume-section.disabled #resetBtn {
      pointer-events: none;
    }

    .disabled-message {
      display: none;
      text-align: center;
      font-size: 11px;
      color: #666;
      margin-bottom: 10px;
    }

    .volume-section.disabled .disabled-message {
      display: block;
    }

    /* Actions */

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .actions-row {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 8px 0;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button:hover {
      opacity: 0.85;
    }

    button:active {
      opacity: 0.7;
    }

    #resetBtn {
      background: #333355;
      color: #ccc;
    }

    .manage-sites-link {
      display: none;
      text-align: center;
      font-size: 11px;
      color: #4a9eff;
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
      padding: 2px 0;
      width: 100%;
      font-family: inherit;
      font-weight: 400;
    }

    .manage-sites-link:hover {
      opacity: 0.8;
      text-decoration: underline;
    }

    .manage-sites-link.visible {
      display: block;
    }

  </style>
</head>
<body>
  <header>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20">
      <polygon points="4,8 10,8 15,4 15,20 10,16 4,16" fill="#4a9eff"/>
      <path d="M17,9 Q20,12 17,15" fill="none" stroke="#4a9eff" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M18.5,6.5 Q23,12 18.5,17.5" fill="none" stroke="#4a9eff" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <h1>Volume Boost</h1>
  </header>

  <div class="whitelist-section" id="whitelistSection">
    <div class="whitelist-row">
      <span class="whitelist-row-label">Whitelist mode</span>
      <label class="toggle-switch">
        <input type="checkbox" id="modeToggle" />
        <span class="toggle-track"></span>
      </label>
    </div>
    <div class="whitelist-row" id="siteRow" style="display: none;">
      <span class="whitelist-row-label" id="siteLabel"></span>
      <label class="toggle-switch">
        <input type="checkbox" id="siteToggle" />
        <span class="toggle-track"></span>
      </label>
    </div>
  </div>

  <div class="volume-section" id="volumeSection">
    <div class="volume-display">
      <div class="volume-value" id="volumeValue">100</div>
      <div class="volume-label">percent</div>
    </div>

    <p class="disabled-message">Enable this site to use boost</p>

    <div class="slider-track">
      <input type="range" id="volumeSlider" min="0" max="200" value="100" step="1" />
      <div class="tick-labels">
        <span>0%</span>
        <span id="tick100" class="active">100%</span>
        <span>400%</span>
      </div>
    </div>

    <div class="actions">
      <div class="actions-row">
        <button id="resetBtn">Reset to 100%</button>
      </div>
      <button class="manage-sites-link" id="manageSitesLink">Manage sites &rarr;</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
